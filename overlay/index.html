<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zoth Multi-Agent Cursor Overlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: -apple-system, BlinkMacSystemFont, "JetBrains Mono", monospace;
    }
    #cursorCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: auto;
    }

    /* Context Radial / Popover Menu */
    #cursorContextMenu {
      position: absolute;
      display: none;
      z-index: 99999;
      background: rgba(11, 14, 22, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.75), 0 0 20px rgba(57, 211, 83, 0.15);
      border-radius: 12px;
      padding: 10px;
      width: 240px;
      backdrop-filter: blur(16px);
      color: #e2e8f0;
      pointer-events: auto;
    }

    .menu-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .menu-badge {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 11px;
    }
    .menu-title {
      font-size: 13px;
      font-weight: 700;
    }
    .menu-coord {
      font-size: 10px;
      color: #64748b;
      margin-left: auto;
      font-family: monospace;
    }

    .menu-items {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .menu-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
    }
    .menu-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      transform: translateX(2px);
    }
    .menu-btn.danger {
      color: #f87171;
    }
    .menu-btn.danger:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.4);
    }
  </style>
</head>
<body>
  <canvas id="cursorCanvas"></canvas>

  <div id="cursorContextMenu">
    <div class="menu-header">
      <div class="menu-badge" id="menuAvatar">◈</div>
      <div>
        <div class="menu-title" id="menuName">Agent</div>
      </div>
      <div class="menu-coord" id="menuCoords">0, 0</div>
    </div>
    <div class="menu-items">
      <button class="menu-btn" onclick="triggerMenuAction('click')">⚡ Execute Click Here</button>
      <button class="menu-btn" onclick="triggerMenuAction('inspect')">🔍 Inspect Element / OCR Under Cursor</button>
      <button class="menu-btn" onclick="triggerMenuAction('glide_rand')">↗ Glide to Random Screen Point</button>
      <button class="menu-btn" onclick="triggerMenuAction('toggle_trail')">✨ Cycle Lattice / Braille Effect</button>
      <button class="menu-btn" onclick="triggerMenuAction('assign_task')">📋 Assign Autonomous Goal...</button>
      <button class="menu-btn danger" onclick="triggerMenuAction('dismiss')">✕ Close Menu</button>
    </div>
  </div>

  <script src="cursor_renderer.js"></script>
</body>
</html>
